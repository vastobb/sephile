[versions]
agp = "8.5.0"
kotlin = "2.0.20"
compose-bom = "2024.10.00"
compose-compiler = "1.6.10"
core-ktx = "1.13.1"
activity-compose = "1.9.0"
lifecycle-runtime-ktx = "2.8.4"
lifecycle-runtime-compose = "2.8.4"
lifecycle-viewmodel-compose = "2.8.4"
hilt-navigation-compose = "1.2.0"
material3 = "1.3.0"
concurrent = "1.1.0"
okio = "3.8.1"
kotlinx-coroutines = "1.10.1"
coil-compose = "2.7.0"
junit = "1.1.5"
androidx-test-runner = "1.6.1"
espresso-core = "3.6.1"
compose-ui-tooling = "1.7.3"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[bundles]
compose-bom = ["compose-bom"]

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-runtime-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-ui-tooling" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-concurrent = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrent" }
okio = { module = "square.okio:okio", version.ref = "okio" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
coil-compose = { module = "io.coil-kt.coil:coil-compose", version.ref = "coil-compose" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
