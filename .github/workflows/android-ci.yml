name: Build Sephile (Debug APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: 27.0.12077973

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Run lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon --console=plain || true

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sephile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
